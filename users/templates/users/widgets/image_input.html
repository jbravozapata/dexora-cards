<div class="profile-image-picker" data-image-picker>
  {% if widget.is_initial %}
    <div class="profile-image-current">
      <span>Imagen configurada</span>
      <a href="{{ widget.value.url }}" target="_blank" rel="noopener">Ver actual</a>
      {% if not widget.required %}
        <label class="profile-image-clear" for="{{ widget.checkbox_id }}">
          <input type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}">
          <span>Quitar</span>
        </label>
      {% endif %}
    </div>
  {% endif %}
  <input type="{{ widget.type }}" name="{{ widget.name }}"{% include "django/forms/widgets/attrs.html" %}>
  <label class="profile-image-action" for="{{ widget.attrs.id }}">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>
    <span>{% if widget.is_initial %}Reemplazar imagen{% else %}Elegir imagen{% endif %}</span>
  </label>
  <small data-file-name>{% if widget.is_initial %}Se conservará la imagen actual{% else %}Ningún archivo seleccionado{% endif %}</small>
</div>
