name: Django CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dexora_test
          POSTGRES_USER: dexora
          POSTGRES_PASSWORD: dexora_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dexora -d dexora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production-4f8fbb62b1944b7b
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://dexora:dexora_ci@127.0.0.1:5432/dexora_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run system checks
        run: python manage.py check

      - name: Run tests
        run: python manage.py test

      - name: Build static assets
        run: python manage.py collectstatic --noinput
