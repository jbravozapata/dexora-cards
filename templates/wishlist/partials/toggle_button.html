<span class="wishlist-toggle wishlist-toggle-{{ placement|default:'grid' }}{% if is_wished %} is-active{% endif %}" id="wishlist-toggle-{{ card.pk }}-{{ placement|default:'grid' }}">
  {% if user.is_authenticated %}
    <form method="post" action="{% url 'wishlist:toggle' card.slug %}" hx-post="{% url 'wishlist:toggle' card.slug %}" {% if placement == "wishlist" %}hx-target="closest .tcg-card" hx-swap="delete"{% else %}hx-target="#wishlist-toggle-{{ card.pk }}-{{ placement|default:'grid' }}" hx-swap="outerHTML"{% endif %}>
      {% csrf_token %}<input type="hidden" name="placement" value="{{ placement|default:'grid' }}"><input type="hidden" name="next" value="{{ request.get_full_path }}">
      <button class="wishlist-star" type="submit" aria-pressed="{% if is_wished %}true{% else %}false{% endif %}" aria-label="{% if is_wished %}Retirar {{ card.name }} de mi wishlist{% else %}Añadir {{ card.name }} a mi wishlist{% endif %}" title="{% if is_wished %}Retirar de mi wishlist{% else %}Añadir a mi wishlist{% endif %}">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="m12 3 2.75 5.57 6.15.9-4.45 4.33 1.05 6.12L12 17.03l-5.5 2.89 1.05-6.12L3.1 9.47l6.15-.9L12 3Z"/></svg>
      </button>
    </form>
  {% else %}
    <a class="wishlist-star" href="{% url 'login' %}?next={{ request.path|urlencode }}" aria-label="Inicia sesión para añadir {{ card.name }} a tu wishlist" title="Inicia sesión para guardar en wishlist"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="m12 3 2.75 5.57 6.15.9-4.45 4.33 1.05 6.12L12 17.03l-5.5 2.89 1.05-6.12L3.1 9.47l6.15-.9L12 3Z"/></svg></a>
  {% endif %}
</span>
