{% extends "base.html" %}
{% block title %}Cardex · Dexora Cards{% endblock %}
{% block content %}
<section class="shell catalog-layout">
  <form class="filters" method="get" hx-get="{% url 'catalog:species-list' %}" hx-target="#species-results" hx-push-url="true" hx-trigger="input changed delay:350ms from:input, change">
    <div class="search-field"><label for="q">Buscar</label><input id="q" name="q" value="{{ request.GET.q }}" placeholder="Nombre o # nacional"><span aria-hidden="true">⌕</span></div>
    <div><label for="generation">Generación</label><select id="generation" name="generation"><option value="">Todas</option>{% for item in generations %}<option value="{{ item }}" {% if request.GET.generation == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></div>
    <div><label for="type">Tipo</label><select id="type" name="type"><option value="">Todos</option>{% for item in types %}<option value="{{ item }}" {% if request.GET.type == item %}selected{% endif %}>{{ item|title }}</option>{% endfor %}</select></div>
    <button class="button button-secondary" type="submit">Aplicar</button>
  </form>
  <div id="species-results" class="results-wrap" aria-live="polite">{% include "catalog/partials/species_results.html" %}</div>
</section>
{% endblock %}
