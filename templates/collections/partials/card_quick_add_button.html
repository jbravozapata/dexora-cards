<span class="card-quick-add card-quick-add-{{ placement|default:'grid' }}{% if owned_quantity %} is-owned{% endif %}" id="card-quick-add-{{ card.pk }}-{{ placement|default:'grid' }}">
  {% if user.is_authenticated %}
    <form method="post" action="{% url 'collection:card-quick-add' card.slug %}" hx-post="{% url 'collection:card-quick-add' card.slug %}" hx-target="#card-quick-add-{{ card.pk }}-{{ placement|default:'grid' }}" hx-swap="outerHTML">
      {% csrf_token %}<input type="hidden" name="placement" value="{{ placement|default:'grid' }}"><input type="hidden" name="next" value="{{ request.get_full_path }}">
      <button class="card-quick-add-button" type="submit" aria-label="Añadir una copia de {{ card.name }} a mi colección" title="Añadir una copia a mi colección">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        {% if owned_quantity %}<span class="card-owned-badge" aria-label="{{ owned_quantity }} en tu colección">{{ owned_quantity }}</span>{% endif %}
      </button>
    </form>
  {% else %}
    <a class="card-quick-add-button" href="{% url 'login' %}?next={{ request.path|urlencode }}" aria-label="Inicia sesión para añadir {{ card.name }} a tu colección" title="Inicia sesión para añadirla"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
  {% endif %}
</span>
